<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Bean &amp; Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#241209; --brown-900:#341A0D; --brown-800:#4A2818;
    --red-700:#8C2A1E; --red-600:#A83324;
    --cream:#F6ECDF; --cream-2:#EFE0CB; --gold:#C79A5C; --ink:#2A1A10;
    --shadow: 0 20px 50px -20px rgba(36,18,9,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif; background:var(--brown-950); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(199,154,92,.22), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(168,51,36,.22), transparent 45%);
  }
  a{ text-decoration:none; color:inherit; }
  h1,h2{ font-family:'Fraunces', serif; font-weight:700; }

  .auth-card{
    background:var(--cream); border-radius:24px; width:100%; max-width:420px;
    padding:44px 38px 38px; box-shadow:var(--shadow); position:relative;
  }
  .tag{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    background:var(--brown-950); color:var(--gold); font-size:11px; font-weight:800;
    letter-spacing:.14em; padding:7px 18px; border-radius:100px; white-space:nowrap;
  }
  .logo{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
  .logo-mark{
    width:44px; height:44px; border-radius:50%; background:var(--brown-950);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
    font-family:'Fraunces',serif; font-weight:700; font-size:18px;
  }
  .logo-text{ font-family:'Fraunces', serif; font-weight:700; font-size:21px; color:var(--brown-950); line-height:1; }
  .logo-text small{ display:block; font-family:'Manrope',sans-serif; font-weight:600; font-size:10px; letter-spacing:.2em; color:var(--red-600); margin-top:3px; }

  .auth-card h1{ font-size:24px; color:var(--brown-950); text-align:center; margin-bottom:6px; }
  .auth-card p.sub{ text-align:center; color:var(--brown-800); font-size:13.5px; opacity:.8; margin-bottom:28px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--brown-900); margin-bottom:7px; letter-spacing:.02em; }
  .field input{
    width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid rgba(74,40,24,.2);
    background:#fff; font-size:14.5px; font-family:'Manrope',sans-serif; color:var(--ink); outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus{ border-color:var(--brown-950); box-shadow:0 0 0 3px rgba(36,18,9,.1); }

  .btn-submit{
    width:100%; padding:14px; border:none; border-radius:100px; background:var(--brown-950); color:var(--cream);
    font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 12px 24px -10px rgba(36,18,9,.5);
    transition:transform .2s ease, box-shadow .2s ease; margin-top:4px;
  }
  .btn-submit:hover{ transform:translateY(-2px); box-shadow:0 16px 28px -10px rgba(36,18,9,.6); }

  .error-msg{ display:none; background:#FBE3DE; color:var(--red-700); font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:18px; }
  .error-msg.show{ display:block; }

  .back-line{ text-align:center; font-size:13px; color:var(--brown-800); margin-top:24px; opacity:.75; }
  .back-line a{ color:var(--red-600); font-weight:700; }
</style>
</head>
<body>

<div class="auth-card">
  <span class="tag">STAFF &amp; ADMIN ACCESS ONLY</span>
  <div class="logo">
    <div class="logo-mark">B&amp;B</div>
    <div class="logo-text">Bean &amp; Brew<small>ADMIN PANEL</small></div>
  </div>

  <h1>Admin Sign In</h1>
  <p class="sub">Manage orders, menu, and café operations</p>

  <div class="error-msg" id="errorMsg">Incorrect admin email or password.</div>

  <form id="adminLoginForm" autocomplete="off">
    <div class="field">
      <label for="adminEmail">Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@beanandbrew.cafe" required>
    </div>
    <div class="field">
      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Sign In to Dashboard</button>
  </form>

  <p class="back-line"><a href="index.html">← Back to Bean &amp; Brew site</a></p>
</div>

<script>
  /*
    Admin login now calls the real backend (/api/admin/login) instead of
    checking a hardcoded email/password in the browser. The server checks
    the password with bcrypt against admin_accounts in the database, and
    returns a signed JWT if it matches. Same-origin API since server.js
    serves this page and /api/... together.
  */
  const API_BASE = '';

  const form = document.getElementById('adminLoginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value.trim().toLowerCase();
    const password = document.getElementById('adminPassword').value;

    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      const res = await fetch(`${API_BASE}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if(!res.ok){
        errorMsg.textContent = data.error || 'Incorrect admin email or password.';
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Dashboard';
        return;
      }

      // Store the real admin token, plus 'bnb-admin' (email) so every
      // existing admin page keeps working without further changes.
      sessionStorage.setItem('bnb-admin-token', data.token);
      sessionStorage.setItem('bnb-admin', data.admin.email);
      sessionStorage.setItem('bnb-admin-role', data.admin.role);
      window.location.href = 'admin-dashboard.html';
    } catch (err) {
      console.error('Admin login request failed:', err);
      errorMsg.textContent = 'Could not reach the server. Is the backend running?';
      errorMsg.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In to Dashboard';
    }
  });
</script>

</body>
</html>
