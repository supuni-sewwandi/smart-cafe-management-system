<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Admin — Bean &amp; Brew Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#241209; --brown-900:#341A0D; --brown-800:#4A2818;
    --red-700:#8C2A1E; --red-600:#A83324;
    --cream:#F6ECDF; --cream-2:#EFE0CB; --gold:#C79A5C; --ink:#2A1A10;
    --green:#3E7A4C; --shadow:0 20px 50px -20px rgba(36,18,9,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Manrope', sans-serif; background:var(--cream-2); color:var(--ink); line-height:1.5; }
  a{ text-decoration:none; color:inherit; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:700; }
  button{ font-family:inherit; }
  .layout{ display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
  .sidebar{ background:var(--brown-950); color:var(--cream-2); padding:26px 20px; display:flex; flex-direction:column; }
  .sidebar .logo{ display:flex; align-items:center; gap:10px; padding:6px 8px 26px; border-bottom:1px solid rgba(246,236,223,.12); margin-bottom:22px; }
  .logo-mark{ width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--brown-950); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:15px; flex-shrink:0; }
  .logo-text{ font-family:'Fraunces',serif; font-weight:700; font-size:17px; color:var(--cream); line-height:1.15; }
  .logo-text small{ display:block; font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.18em; color:var(--gold); margin-top:3px; }
  .nav-group{ margin-bottom:22px; }
  .nav-group h4{ font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--cream-2); opacity:.4; font-weight:700; padding:0 10px; margin-bottom:10px; }
  .nav-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--cream-2); opacity:.8; cursor:pointer; transition:background .2s, opacity .2s; border:none; background:none; width:100%; text-align:left; }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(246,236,223,.08); opacity:1; }
  .nav-item.active{ background:var(--red-600); opacity:1; color:var(--cream); }
  .sidebar-foot{ margin-top:auto; padding-top:18px; border-top:1px solid rgba(246,236,223,.12); }
  .admin-chip{ display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:10px; }
  .admin-avatar{ width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--brown-950); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
  .admin-chip div p{ font-size:12.5px; font-weight:700; color:var(--cream); }
  .admin-chip div span{ font-size:10.5px; color:var(--gold); font-weight:700; letter-spacing:.04em; }
  .logout-link{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:700; color:var(--cream-2); opacity:.75; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
  .logout-link:hover{ opacity:1; color:var(--gold); }
  .logout-link svg{ width:16px; height:16px; }

  main{ padding:34px 40px 60px; overflow-x:hidden; }
  .topline{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:14px; }
  .topline h1{ font-size:26px; color:var(--brown-950); margin-bottom:5px; }
  .topline p{ font-size:13.5px; color:var(--brown-800); opacity:.75; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:100px; font-weight:700; font-size:13px; cursor:pointer; border:1.5px solid transparent; }
  .btn-primary{ background:var(--red-600); color:var(--cream); }
  .btn-outline{ background:transparent; border:1.5px solid var(--brown-800); color:var(--brown-900); }
  .btn-small{ padding:7px 14px; font-size:12px; }

  .tabs{ display:flex; margin-bottom:24px; border-bottom:1px solid rgba(74,40,24,.12); }
  .tab{ padding:11px 6px; margin-right:24px; font-size:13.5px; font-weight:700; color:var(--brown-800); opacity:.55; background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ opacity:1; color:var(--red-600); border-color:var(--red-600); }

  .panel{ background:#fff; border-radius:18px; padding:24px; box-shadow:0 10px 26px -20px rgba(36,18,9,.3); }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--brown-800); opacity:.55; font-weight:800; padding-bottom:12px; border-bottom:1px solid rgba(74,40,24,.1); }
  tbody td{ padding:13px 6px 13px 0; border-bottom:1px solid rgba(74,40,24,.07); font-size:13.5px; color:var(--brown-950); vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }

  .pill{ font-size:11px; font-weight:800; padding:5px 11px; border-radius:100px; display:inline-block; }
  .pill.active{ background:rgba(62,122,76,.12); color:var(--green); }
  .pill.inactive{ background:rgba(168,51,36,.1); color:var(--red-600); }

  .role-badge{ font-size:11px; font-weight:800; padding:4px 10px; border-radius:100px; background:rgba(199,154,92,.2); color:#9C7530; }

  .icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid rgba(74,40,24,.15); background:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; margin-right:4px; }
  .icon-btn svg{ width:14px; height:14px; }
  .icon-btn:hover{ background:var(--cream-2); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(36,18,9,.5); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:#fff; border-radius:18px; padding:28px; width:100%; max-width:420px; box-shadow:var(--shadow); }
  .modal h3{ font-size:18px; color:var(--brown-950); margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--brown-900); margin-bottom:6px; }
  .field input, .field select{ width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid rgba(74,40,24,.18); font-size:13.5px; font-family:inherit; outline:none; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; }

  /* Roles & permissions matrix */
  .perm-table th, .perm-table td{ text-align:center; }
  .perm-table th:first-child, .perm-table td:first-child{ text-align:left; }
  .perm-check{ width:18px; height:18px; accent-color:var(--red-600); cursor:pointer; }
  .save-perms-row{ display:flex; justify-content:flex-end; margin-top:18px; }

  @media(max-width:1100px){ .layout{ grid-template-columns:210px 1fr; } }
  @media(max-width:720px){ .layout{ grid-template-columns:1fr; } .sidebar{ display:none; } main{ padding:24px 20px 50px; } }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">B&amp;B</div>
      <div class="logo-text">Bean &amp; Brew<small>ADMIN PANEL</small></div>
    </div>
    <div class="nav-group">
      <h4>Overview</h4>
      <a class="nav-item" href="admin-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
    </div>
    <div class="nav-group">
      <h4>Operations</h4>
      <a class="nav-item" href="staff-orders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13a3 3 0 0 1 0 6h-1M4 8v8a4 4 0 0 0 4 4h5a4 4 0 0 0 4-4v-1M4 8l1-4h9l1 4"/></svg>
        Orders
      </a>
      <a class="nav-item" href="inventory.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Inventory
      </a>
      <a class="nav-item" href="suppliers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>
        Suppliers
      </a>
      <a class="nav-item" href="staff.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="8" r="2.6"/><path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.6"/></svg>
        Staff &amp; Team
      </a>
    </div>
    <div class="nav-group">
      <h4>System</h4>
      <a class="nav-item active" href="system-admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        System Admin
      </a>
    </div>
    <div class="nav-group">
      <h4>Insights</h4>
      <a class="nav-item" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M11 19V4M18 19v-6"/></svg>
        Reports
      </a>
    </div>
    <div class="sidebar-foot">
      <div class="admin-chip">
        <div class="admin-avatar" id="adminAvatar">A</div>
        <div><p id="adminEmailLabel">admin</p><span>ADMINISTRATOR</span></div>
      </div>
      <button class="logout-link" id="adminLogoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log Out
      </button>
    </div>
  </aside>

  <main>
    <div class="topline">
      <div>
        <h1>System Administration</h1>
        <p>Manage login accounts and control what each role can access.</p>
      </div>
      <button class="btn btn-primary" id="addAccountBtn" style="display:none;">+ Add Account</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="accounts">User Accounts</button>
      <button class="tab" data-tab="roles">Roles &amp; Permissions</button>
    </div>

    <div class="panel" id="tabContent"></div>
  </main>
</div>

<div class="modal-overlay" id="accountModalOverlay">
  <div class="modal">
    <h3 id="accountModalTitle">Add Account</h3>
    <input type="hidden" id="accountEditId">
    <div class="field"><label>Full Name</label><input type="text" id="accountName" placeholder="e.g. Ishara Fernando"></div>
    <div class="field"><label>Email</label><input type="email" id="accountEmail" placeholder="name@beanandbrew.cafe"></div>
    <div class="field"><label>Role</label>
      <select id="accountRole">
        <option>Café Owner</option>
        <option>Café Manager</option>
        <option>System Administrator</option>
        <option>Cashier</option>
        <option>Inventory Manager</option>
        <option>Café Staff</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="accountModalCancel">Cancel</button>
      <button class="btn btn-primary" id="accountModalSave">Save Account</button>
    </div>
  </div>
</div>

<script>
  const adminEmail = sessionStorage.getItem('bnb-admin');
  if(!adminEmail){ window.location.href = 'admin-login.html'; }
  document.getElementById('adminEmailLabel').textContent = adminEmail;
  document.getElementById('adminAvatar').textContent = adminEmail.charAt(0).toUpperCase();
  document.getElementById('adminLogoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('bnb-admin');
    window.location.href = 'admin-login.html';
  });

  const ACCOUNTS_KEY = 'bnb-admin-accounts';
  const PERMS_KEY = 'bnb-role-permissions';
  const MODULES = ['Orders','Inventory','Suppliers','Staff','Reports','System Admin'];
  const ROLES = ['Café Owner','Café Manager','System Administrator','Cashier','Inventory Manager','Café Staff'];

  function getAccounts(){
    try{
      const data = JSON.parse(localStorage.getItem(ACCOUNTS_KEY));
      if(data && data.length) return data;
    }catch(e){}
    const seed = [
      { id:'1', name:'Bean & Brew Admin', email:'admin@beanandbrew.cafe', role:'System Administrator', status:'active' },
      { id:'2', name:'Nadeesha Perera', email:'nadeesha@beanandbrew.cafe', role:'Café Manager', status:'active' },
      { id:'3', name:'Ishara Fernando', email:'ishara@beanandbrew.cafe', role:'Cashier', status:'active' },
      { id:'4', name:'Kasun Silva', role:'Inventory Manager', email:'kasun@beanandbrew.cafe', status:'inactive' },
    ];
    localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(seed));
    return seed;
  }
  function saveAccounts(list){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list)); }

  function getPermissions(){
    try{
      const data = JSON.parse(localStorage.getItem(PERMS_KEY));
      if(data) return data;
    }catch(e){}
    const seed = {
      'Café Owner':          { Orders:true, Inventory:true, Suppliers:true, Staff:true, Reports:true, 'System Admin':true },
      'Café Manager':        { Orders:true, Inventory:true, Suppliers:true, Staff:true, Reports:true, 'System Admin':false },
      'System Administrator':{ Orders:false, Inventory:false, Suppliers:false, Staff:false, Reports:false, 'System Admin':true },
      'Cashier':             { Orders:true, Inventory:false, Suppliers:false, Staff:false, Reports:false, 'System Admin':false },
      'Inventory Manager':   { Orders:false, Inventory:true, Suppliers:true, Staff:false, Reports:false, 'System Admin':false },
      'Café Staff':          { Orders:true, Inventory:false, Suppliers:false, Staff:false, Reports:false, 'System Admin':false },
    };
    localStorage.setItem(PERMS_KEY, JSON.stringify(seed));
    return seed;
  }
  function savePermissions(data){ localStorage.setItem(PERMS_KEY, JSON.stringify(data)); }

  let currentTab = 'accounts';

  function renderAccountsTab(){
    const accounts = getAccounts();
    return `
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${accounts.map(a => `
            <tr>
              <td><strong>${a.name}</strong></td>
              <td>${a.email}</td>
              <td><span class="role-badge">${a.role}</span></td>
              <td><span class="pill ${a.status}">${a.status === 'active' ? 'Active' : 'Deactivated'}</span></td>
              <td>
                <button class="icon-btn" data-edit="${a.id}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                <button class="icon-btn" data-toggle="${a.id}" title="${a.status === 'active' ? 'Deactivate' : 'Activate'}">
                  ${a.status === 'active'
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8"/></svg>'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>'}
                </button>
                <button class="icon-btn" data-remove="${a.id}" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12z"/></svg></button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }

  function renderRolesTab(){
    const perms = getPermissions();
    return `
      <p style="font-size:13px; color:var(--brown-800); opacity:.7; margin-bottom:18px;">
        Tick which modules each role is allowed to access. Changes apply the next time that role signs in.
      </p>
      <table class="perm-table">
        <thead><tr><th>Role</th>${MODULES.map(m => `<th>${m}</th>`).join('')}</tr></thead>
        <tbody>
          ${ROLES.map(role => `
            <tr>
              <td><strong>${role}</strong></td>
              ${MODULES.map(m => `
                <td><input type="checkbox" class="perm-check" data-role="${role}" data-module="${m}" ${perms[role] && perms[role][m] ? 'checked' : ''}></td>
              `).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="save-perms-row"><button class="btn btn-primary btn-small" id="savePermsBtn">Save Permissions</button></div>`;
  }

  function renderTabContent(){
    document.getElementById('addAccountBtn').style.display = currentTab === 'accounts' ? 'inline-flex' : 'none';
    document.getElementById('tabContent').innerHTML =
      currentTab === 'accounts' ? renderAccountsTab() : renderRolesTab();
    attachEvents();
  }

  function attachEvents(){
    document.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openAccountModal(btn.dataset.edit)));
    document.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const list = getAccounts();
      const target = list.find(a => a.id === btn.dataset.toggle);
      target.status = target.status === 'active' ? 'inactive' : 'active';
      saveAccounts(list);
      renderTabContent();
    }));
    document.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
      if(!confirm('Remove this account?')) return;
      saveAccounts(getAccounts().filter(a => a.id !== btn.dataset.remove));
      renderTabContent();
    }));
    const savePermsBtn = document.getElementById('savePermsBtn');
    if(savePermsBtn){
      savePermsBtn.addEventListener('click', () => {
        const perms = getPermissions();
        document.querySelectorAll('.perm-check').forEach(cb => {
          const role = cb.dataset.role, mod = cb.dataset.module;
          if(!perms[role]) perms[role] = {};
          perms[role][mod] = cb.checked;
        });
        savePermissions(perms);
        savePermsBtn.textContent = 'Saved ✓';
        setTimeout(() => savePermsBtn.textContent = 'Save Permissions', 1400);
      });
    }
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      renderTabContent();
    });
  });

  const accountModalOverlay = document.getElementById('accountModalOverlay');
  function openAccountModal(editId){
    document.getElementById('accountModalTitle').textContent = editId ? 'Edit Account' : 'Add Account';
    document.getElementById('accountEditId').value = editId || '';
    if(editId){
      const a = getAccounts().find(x => x.id === editId);
      document.getElementById('accountName').value = a.name;
      document.getElementById('accountEmail').value = a.email;
      document.getElementById('accountRole').value = a.role;
    } else {
      document.getElementById('accountName').value = '';
      document.getElementById('accountEmail').value = '';
    }
    accountModalOverlay.classList.add('open');
  }
  document.getElementById('addAccountBtn').addEventListener('click', () => openAccountModal(null));
  document.getElementById('accountModalCancel').addEventListener('click', () => accountModalOverlay.classList.remove('open'));
  document.getElementById('accountModalSave').addEventListener('click', () => {
    const name = document.getElementById('accountName').value.trim();
    const email = document.getElementById('accountEmail').value.trim();
    if(!name || !email){ alert('Please enter a name and email.'); return; }
    const editId = document.getElementById('accountEditId').value;
    const list = getAccounts();
    const payload = { name, email, role: document.getElementById('accountRole').value, status: 'active' };
    if(editId){
      const idx = list.findIndex(a => a.id === editId);
      list[idx] = { ...list[idx], ...payload, status: list[idx].status };
    } else {
      list.push({ id: String(Date.now()), ...payload });
    }
    saveAccounts(list);
    accountModalOverlay.classList.remove('open');
    renderTabContent();
  });

  renderTabContent();
</script>

</body>
</html>
