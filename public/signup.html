<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Bean &amp; Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#241209; --brown-900:#341A0D; --brown-800:#4A2818;
    --red-700:#8C2A1E; --red-600:#A83324;
    --cream:#F6ECDF; --cream-2:#EFE0CB; --gold:#C79A5C; --ink:#2A1A10;
    --shadow: 0 20px 50px -20px rgba(36,18,9,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Manrope', sans-serif; background:var(--brown-950); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(168,51,36,.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(199,154,92,.18), transparent 45%);
  }
  a{ text-decoration:none; color:inherit; }
  h1,h2{ font-family:'Fraunces', serif; font-weight:700; }

  .auth-card{
    background:var(--cream); border-radius:24px; width:100%; max-width:420px;
    padding:44px 38px 38px; box-shadow:var(--shadow); position:relative;
  }
  .logo{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:26px; }
  .logo-mark{
    width:44px; height:44px; border-radius:50%; background:var(--red-600);
    display:flex; align-items:center; justify-content:center; color:var(--cream);
    font-family:'Fraunces',serif; font-weight:700; font-size:18px;
  }
  .logo-text{ font-family:'Fraunces', serif; font-weight:700; font-size:21px; color:var(--brown-950); line-height:1; }
  .logo-text small{ display:block; font-family:'Manrope',sans-serif; font-weight:600; font-size:10px; letter-spacing:.2em; color:var(--red-600); margin-top:3px; }

  .auth-card h1{ font-size:26px; color:var(--brown-950); text-align:center; margin-bottom:6px; }
  .auth-card p.sub{ text-align:center; color:var(--brown-800); font-size:14px; opacity:.8; margin-bottom:28px; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--brown-900); margin-bottom:7px; letter-spacing:.02em; }
  .field input{
    width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid rgba(74,40,24,.2);
    background:#fff; font-size:14.5px; font-family:'Manrope',sans-serif; color:var(--ink); outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus{ border-color:var(--red-600); box-shadow:0 0 0 3px rgba(168,51,36,.12); }
  .field small{ display:block; margin-top:6px; font-size:11.5px; color:var(--brown-800); opacity:.65; }

  .terms-row{ display:flex; align-items:flex-start; gap:9px; margin-bottom:22px; font-size:12.5px; color:var(--brown-800); }
  .terms-row input{ margin-top:2px; accent-color:var(--red-600); }
  .terms-row a{ color:var(--red-600); font-weight:700; }

  .btn-submit{
    width:100%; padding:14px; border:none; border-radius:100px; background:var(--red-600); color:var(--cream);
    font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 12px 24px -10px rgba(168,51,36,.6);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-submit:hover{ transform:translateY(-2px); box-shadow:0 16px 28px -10px rgba(168,51,36,.7); }
  .btn-submit:disabled{ opacity:.6; cursor:not-allowed; transform:none; }

  .divider{ display:flex; align-items:center; gap:12px; margin:26px 0; color:var(--brown-800); opacity:.55; font-size:12px; font-weight:700; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:rgba(74,40,24,.2); }

  .login-line{ text-align:center; font-size:14px; color:var(--brown-800); }
  .login-line a{ color:var(--red-600); font-weight:700; }

  .error-msg{ display:none; background:#FBE3DE; color:var(--red-700); font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:18px; }
  .error-msg.show{ display:block; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">
    <div class="logo-mark">B&amp;B</div>
    <div class="logo-text">Bean &amp; Brew<small>ROASTERY &amp; CAFÉ</small></div>
  </div>

  <h1>Create your account</h1>
  <p class="sub">Sign up to order, track, and save your favourites</p>

  <div class="error-msg" id="errorMsg"></div>

  <form id="signupForm">
    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Your name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@email.com" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required>
      <small>Use 6 or more characters with a mix of letters and numbers.</small>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" required>
    </div>
    <div class="terms-row">
      <input type="checkbox" id="terms" required>
      <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
  </form>

  <div class="divider">OR</div>

  <p class="login-line">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script>
  // Same-origin API since server.js serves this page and the /api routes
  // together. Change if you host the front-end separately.
  const API_BASE = '';

  const form = document.getElementById('signupForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const terms = document.getElementById('terms').checked;

    if(!fullName || !email || !password || !confirmPassword){
      showError('Please fill in all fields.');
      return;
    }
    if(password.length < 6){
      showError('Password must be at least 6 characters.');
      return;
    }
    if(password !== confirmPassword){
      showError('Passwords do not match.');
      return;
    }
    if(!terms){
      showError('Please accept the Terms of Service to continue.');
      return;
    }
    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    try {
      const res = await fetch(`${API_BASE}/api/auth/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, email, password })
      });
      const data = await res.json();

      if(!res.ok){
        showError(data.error || 'Could not create your account.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        return;
      }

      localStorage.setItem('bnb-token', data.token);
      localStorage.setItem('bnb-user', data.user.email);
      localStorage.setItem('bnb-user-name', data.user.fullName);

      const redirectTo = sessionStorage.getItem('bnb-redirect') || 'profile.html';
      sessionStorage.removeItem('bnb-redirect');
      window.location.href = redirectTo;
    } catch (err) {
      console.error('Signup request failed:', err);
      showError('Could not reach the server. Is the backend running?');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    }
  });
</script>

</body>
</html>
