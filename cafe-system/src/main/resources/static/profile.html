<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Bean &amp; Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#241209; --brown-900:#341A0D; --brown-800:#4A2818;
    --red-700:#8C2A1E; --red-600:#A83324;
    --cream:#F6ECDF; --cream-2:#EFE0CB; --gold:#C79A5C; --ink:#2A1A10;
    --shadow: 0 20px 50px -20px rgba(36,18,9,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Manrope', sans-serif; background:var(--cream); color:var(--ink); line-height:1.5; }
  a{ text-decoration:none; color:inherit; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:700; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 28px; }

  header{ background:rgba(246,236,223,.95); border-bottom:1px solid rgba(74,40,24,.1); padding:18px 0; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-mark{ width:40px; height:40px; border-radius:50%; background:var(--red-600); display:flex; align-items:center; justify-content:center; color:var(--cream); font-family:'Fraunces',serif; font-weight:700; font-size:16px; }
  .logo-text{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; color:var(--brown-950); }
  .back-link{ font-size:13.5px; font-weight:700; color:var(--brown-800); display:flex; align-items:center; gap:6px; }
  .back-link svg{ width:15px; height:15px; }
  .notif-bell{ position:relative; width:38px; height:38px; border-radius:50%; border:1px solid rgba(74,40,24,.2); display:flex; align-items:center; justify-content:center; margin-left:14px; }
  .notif-bell svg{ width:17px; height:17px; }
  .notif-badge{ position:absolute; top:-4px; right:-4px; background:var(--red-600); color:var(--cream); font-size:9.5px; font-weight:800; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .header-right{ display:flex; align-items:center; }

  main{ padding:44px 0 90px; }

  .profile-head{ display:flex; align-items:center; gap:20px; margin-bottom:30px; flex-wrap:wrap; }
  .avatar{ width:72px; height:72px; border-radius:50%; background:var(--red-600); color:var(--cream); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:26px; font-weight:700; flex-shrink:0; }
  .profile-head h1{ font-size:26px; color:var(--brown-950); margin-bottom:4px; }
  .profile-head p{ font-size:14px; color:var(--brown-800); opacity:.75; }
  .logout-btn{ margin-left:auto; padding:11px 22px; border-radius:100px; border:1.5px solid var(--brown-800); color:var(--brown-900); font-weight:700; font-size:13.5px; cursor:pointer; background:transparent; transition:background .2s, color .2s; }
  .logout-btn:hover{ background:var(--brown-950); color:var(--cream); border-color:var(--brown-950); }

  .quick-links{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:36px; }
  .qlink{ background:#fff; border-radius:16px; padding:20px 18px; box-shadow:0 10px 26px -20px rgba(36,18,9,.3); transition:transform .2s; }
  .qlink:hover{ transform:translateY(-4px); }
  .qlink .icon{ width:38px; height:38px; border-radius:11px; background:rgba(168,51,36,.1); color:var(--red-600); display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .qlink .icon svg{ width:19px; height:19px; }
  .qlink strong{ display:block; font-size:14px; color:var(--brown-950); margin-bottom:3px; }
  .qlink span{ font-size:11.5px; color:var(--brown-800); opacity:.65; }

  .section-title{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .section-title h2{ font-size:19px; color:var(--brown-950); }
  .section-title a{ font-size:13px; font-weight:700; color:var(--red-600); }

  .order-card{ background:#fff; border-radius:16px; padding:22px 24px; margin-bottom:16px; box-shadow:0 10px 26px -20px rgba(36,18,9,.3); }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .order-id{ font-weight:800; color:var(--brown-950); font-size:15px; }
  .order-date{ font-size:12.5px; color:var(--brown-800); opacity:.65; }
  .order-status{ background:rgba(168,51,36,.1); color:var(--red-700); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:5px 12px; border-radius:100px; }
  .order-items-list{ font-size:13.5px; color:var(--brown-800); margin-bottom:14px; }
  .order-items-list div{ display:flex; justify-content:space-between; padding:4px 0; }
  .order-bottom{ display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(74,40,24,.1); padding-top:12px; }
  .order-total{ font-weight:800; color:var(--red-600); font-family:'Fraunces',serif; font-size:16px; }
  .order-method{ font-size:12px; color:var(--brown-800); opacity:.7; text-transform:capitalize; }

  .empty-state{ text-align:center; padding:60px 20px; background:#fff; border-radius:18px; }
  .empty-state svg{ width:52px; height:52px; stroke:var(--brown-800); opacity:.35; margin-bottom:16px; }
  .empty-state h3{ font-size:18px; color:var(--brown-950); margin-bottom:8px; }
  .empty-state p{ font-size:14px; color:var(--brown-800); opacity:.7; margin-bottom:22px; }
  .empty-state a{ display:inline-block; padding:12px 26px; background:var(--red-600); color:var(--cream); border-radius:100px; font-weight:700; font-size:14px; }

  @media(max-width:760px){ .quick-links{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="menu.html" class="logo">
      <div class="logo-mark">B&amp;B</div>
      <div class="logo-text">Bean &amp; Brew</div>
    </a>
    <div class="header-right">
      <a href="menu.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Back to Menu</a>
      <a href="notifications.html" class="notif-bell" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
      </a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="profile-head">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <h1 id="userEmail">Loading...</h1>
        <p>Bean &amp; Brew Member</p>
      </div>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>

    <div class="quick-links">
      <a class="qlink" href="edit-profile.html">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
        <strong>Edit Profile</strong>
        <span>Update your details</span>
      </a>
      <a class="qlink" href="order-tracking.html">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13a3 3 0 0 1 0 6h-1M4 8v8a4 4 0 0 0 4 4h5a4 4 0 0 0 4-4v-1M4 8l1-4h9l1 4"/></svg></div>
        <strong>Track Orders</strong>
        <span>See live order status</span>
      </a>
      <a class="qlink" href="reservation.html">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></div>
        <strong>Reserve a Table</strong>
        <span>Book your next visit</span>
      </a>
      <a class="qlink" href="feedback.html">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.8 6.2 6.8.6-5.1 4.5 1.5 6.7L12 16.6 5.9 20l1.6-6.7L2.4 8.8l6.8-.6L12 2z"/></svg></div>
        <strong>Give Feedback</strong>
        <span>Tell us how we did</span>
      </a>
    </div>

    <div class="section-title">
      <h2>My Orders</h2>
    </div>

    <div id="ordersContainer"></div>
  </div>
</main>

<script>
  // Require login to view this page
  const user = localStorage.getItem('bnb-user');
  if(!user){
    sessionStorage.setItem('bnb-redirect', 'profile.html');
    window.location.href = 'login.html';
  }

  document.getElementById('userEmail').textContent = user;
  document.getElementById('avatarInitial').textContent = user ? user.charAt(0).toUpperCase() : '?';

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('bnb-user');
    localStorage.removeItem('bnb-cart');
    window.location.href = 'index.html';
  });

  // Unread notification badge
  function renderNotifBadge(){
    let list = [];
    try{ list = JSON.parse(localStorage.getItem('bnb-notifications-' + user)) || []; }catch(e){ list = []; }
    const unread = list.filter(n => !n.read).length;
    const badge = document.getElementById('notifBadge');
    if(unread > 0){
      badge.style.display = 'flex';
      badge.textContent = unread > 9 ? '9+' : unread;
    }
  }
  renderNotifBadge();

  function loadOrders(){
    const key = 'bnb-orders-' + user;
    let orders = [];
    try{ orders = JSON.parse(localStorage.getItem(key)) || []; }catch(e){ orders = []; }

    const container = document.getElementById('ordersContainer');

    if(orders.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 8h13a3 3 0 0 1 0 6h-1M4 8v8a4 4 0 0 0 4 4h5a4 4 0 0 0 4-4v-1M4 8l1-4h9l1 4"/></svg>
          <h3>No orders yet</h3>
          <p>Your past orders will show up here once you place one.</p>
          <a href="menu.html">Browse the Menu</a>
        </div>`;
      return;
    }

    container.innerHTML = orders.map(order => `
      <a class="order-card" href="order-tracking.html?order=${order.id}" style="display:block;">
        <div class="order-top">
          <div>
            <div class="order-id">Order #${order.id}</div>
            <div class="order-date">${order.date}</div>
          </div>
          <span class="order-status">${order.status || 'Confirmed'}</span>
        </div>
        <div class="order-items-list">
          ${order.items.map(i => `<div><span>${i.name} × ${i.qty}</span><span>Rs ${i.price * i.qty}</span></div>`).join('')}
        </div>
        <div class="order-bottom">
          <span class="order-method">${order.method === 'card' ? 'Paid by Card' : 'Cash on Delivery'}</span>
          <span class="order-total">Rs ${order.total.toLocaleString()}</span>
        </div>
      </a>
    `).join('');
  }
  loadOrders();
</script>

</body>
</html>
