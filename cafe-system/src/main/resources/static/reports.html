<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports &amp; Analytics — Bean &amp; Brew Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#241209; --brown-900:#341A0D; --brown-800:#4A2818;
    --red-700:#8C2A1E; --red-600:#A83324;
    --cream:#F6ECDF; --cream-2:#EFE0CB; --gold:#C79A5C; --ink:#2A1A10;
    --green:#3E7A4C; --shadow:0 20px 50px -20px rgba(36,18,9,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Manrope', sans-serif; background:var(--cream-2); color:var(--ink); line-height:1.5; }
  a{ text-decoration:none; color:inherit; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:700; }
  button{ font-family:inherit; }
  .layout{ display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
  .sidebar{ background:var(--brown-950); color:var(--cream-2); padding:26px 20px; display:flex; flex-direction:column; }
  .sidebar .logo{ display:flex; align-items:center; gap:10px; padding:6px 8px 26px; border-bottom:1px solid rgba(246,236,223,.12); margin-bottom:22px; }
  .logo-mark{ width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--brown-950); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:15px; flex-shrink:0; }
  .logo-text{ font-family:'Fraunces',serif; font-weight:700; font-size:17px; color:var(--cream); line-height:1.15; }
  .logo-text small{ display:block; font-family:'Manrope',sans-serif; font-weight:700; font-size:9.5px; letter-spacing:.18em; color:var(--gold); margin-top:3px; }
  .nav-group{ margin-bottom:22px; }
  .nav-group h4{ font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--cream-2); opacity:.4; font-weight:700; padding:0 10px; margin-bottom:10px; }
  .nav-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600; color:var(--cream-2); opacity:.8; cursor:pointer; transition:background .2s, opacity .2s; border:none; background:none; width:100%; text-align:left; }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(246,236,223,.08); opacity:1; }
  .nav-item.active{ background:var(--red-600); opacity:1; color:var(--cream); }
  .sidebar-foot{ margin-top:auto; padding-top:18px; border-top:1px solid rgba(246,236,223,.12); }
  .admin-chip{ display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:10px; }
  .admin-avatar{ width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--brown-950); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }
  .admin-chip div p{ font-size:12.5px; font-weight:700; color:var(--cream); }
  .admin-chip div span{ font-size:10.5px; color:var(--gold); font-weight:700; letter-spacing:.04em; }
  .logout-link{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:700; color:var(--cream-2); opacity:.75; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
  .logout-link:hover{ opacity:1; color:var(--gold); }
  .logout-link svg{ width:16px; height:16px; }

  main{ padding:34px 40px 60px; overflow-x:hidden; }
  .topline{ margin-bottom:24px; }
  .topline h1{ font-size:26px; color:var(--brown-950); margin-bottom:5px; }
  .topline p{ font-size:13.5px; color:var(--brown-800); opacity:.75; }

  .tabs{ display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid rgba(74,40,24,.12); overflow-x:auto; }
  .tab{ padding:11px 6px; margin-right:22px; font-size:13px; font-weight:700; color:var(--brown-800); opacity:.55; background:none; border:none; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .tab.active{ opacity:1; color:var(--red-600); border-color:var(--red-600); }

  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:24px; }
  .stat-card{ background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 10px 26px -20px rgba(36,18,9,.3); }
  .stat-card h3{ font-size:22px; color:var(--brown-950); }
  .stat-card span{ font-size:12px; color:var(--brown-800); opacity:.7; font-weight:600; }

  .panel{ background:#fff; border-radius:18px; padding:26px; box-shadow:0 10px 26px -20px rgba(36,18,9,.3); margin-bottom:22px; }
  .panel h2{ font-size:16.5px; color:var(--brown-950); margin-bottom:20px; }

  /* Simple bar chart built from divs (no external chart library needed) */
  .bar-chart{ display:flex; align-items:flex-end; gap:14px; height:180px; padding-top:10px; }
  .bar-chart .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar-chart .bar{ width:100%; max-width:38px; background:var(--red-600); border-radius:6px 6px 0 0; transition:height .3s ease; }
  .bar-chart .bar.gold{ background:var(--gold); }
  .bar-chart .bar-label{ font-size:11px; color:var(--brown-800); opacity:.65; margin-top:8px; text-align:center; }
  .bar-chart .bar-value{ font-size:11px; font-weight:800; color:var(--brown-950); margin-bottom:4px; }

  .rank-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid rgba(74,40,24,.08); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-num{ width:26px; height:26px; border-radius:50%; background:var(--cream-2); color:var(--brown-900); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; flex-shrink:0; }
  .rank-info{ flex:1; }
  .rank-info strong{ display:block; font-size:14px; color:var(--brown-950); }
  .rank-bar-track{ height:6px; border-radius:100px; background:rgba(74,40,24,.1); margin-top:6px; overflow:hidden; }
  .rank-bar-fill{ height:100%; background:var(--red-600); border-radius:100px; }
  .rank-value{ font-family:'Fraunces',serif; font-weight:700; color:var(--red-600); font-size:14px; white-space:nowrap; }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--brown-800); opacity:.55; font-weight:800; padding-bottom:12px; border-bottom:1px solid rgba(74,40,24,.1); }
  tbody td{ padding:12px 6px 12px 0; border-bottom:1px solid rgba(74,40,24,.07); font-size:13.5px; color:var(--brown-950); }
  tbody tr:last-child td{ border-bottom:none; }
  .pill{ font-size:11px; font-weight:800; padding:5px 11px; border-radius:100px; display:inline-block; }
  .pill.ok{ background:rgba(62,122,76,.12); color:var(--green); }
  .pill.low{ background:rgba(168,51,36,.1); color:var(--red-600); }

  .bi-embed{ border:2px dashed rgba(74,40,24,.25); border-radius:16px; padding:50px 30px; text-align:center; background:var(--cream-2); }
  .bi-embed svg{ width:48px; height:48px; color:var(--brown-800); opacity:.4; margin-bottom:16px; }
  .bi-embed h3{ font-size:17px; color:var(--brown-950); margin-bottom:8px; }
  .bi-embed p{ font-size:13.5px; color:var(--brown-800); opacity:.7; max-width:460px; margin:0 auto; }

  .empty-note{ text-align:center; font-size:13px; color:var(--brown-800); opacity:.6; padding:30px 0; }

  @media(max-width:1100px){ .layout{ grid-template-columns:210px 1fr; } .stat-row{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:720px){ .layout{ grid-template-columns:1fr; } .sidebar{ display:none; } main{ padding:24px 20px 50px; } }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">B&amp;B</div>
      <div class="logo-text">Bean &amp; Brew<small>ADMIN PANEL</small></div>
    </div>
    <div class="nav-group">
      <h4>Overview</h4>
      <a class="nav-item" href="admindashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
    </div>
    <div class="nav-group">
      <h4>Operations</h4>
      <a class="nav-item" href="stafforders.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13a3 3 0 0 1 0 6h-1M4 8v8a4 4 0 0 0 4 4h5a4 4 0 0 0 4-4v-1M4 8l1-4h9l1 4"/></svg>
        Orders
      </a>
      <a class="nav-item" href="inventory.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Inventory
      </a>
      <a class="nav-item" href="suppliers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>
        Suppliers
      </a>
      <a class="nav-item" href="staff.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="8" r="2.6"/><path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.6"/></svg>
        Staff &amp; Team
      </a>
    </div>
    <div class="nav-group">
      <h4>System</h4>
      <a class="nav-item" href="systemadmin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        System Admin
      </a>
    </div>
    <div class="nav-group">
      <h4>Insights</h4>
      <a class="nav-item active" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M11 19V4M18 19v-6"/></svg>
        Reports
      </a>
    </div>
    <div class="sidebar-foot">
      <div class="admin-chip">
        <div class="admin-avatar" id="adminAvatar">A</div>
        <div><p id="adminEmailLabel">admin</p><span>ADMINISTRATOR</span></div>
      </div>
      <button class="logout-link" id="adminLogoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log Out
      </button>
    </div>
  </aside>

  <main>
    <div class="topline">
      <h1>Reports &amp; Analytics</h1>
      <p>Sales, revenue, customer trends and operational insight — all in one place.</p>
    </div>

    <div class="tabs" id="tabRow">
      <button class="tab active" data-tab="sales">Sales &amp; Revenue</button>
      <button class="tab" data-tab="bestsellers">Best-Selling Items</button>
      <button class="tab" data-tab="customers">Customer Trends</button>
      <button class="tab" data-tab="peak">Peak Hours</button>
      <button class="tab" data-tab="inventory">Inventory Report</button>
      <button class="tab" data-tab="operations">Operational Report</button>
      <button class="tab" data-tab="powerbi">Power BI Dashboard</button>
    </div>

    <div id="tabContent"></div>
  </main>
</div>

<script>
  const adminEmail = sessionStorage.getItem('bnb-admin');
  if(!adminEmail){ window.location.href = 'admin-login.html'; }
  document.getElementById('adminEmailLabel').textContent = adminEmail;
  document.getElementById('adminAvatar').textContent = adminEmail.charAt(0).toUpperCase();
  document.getElementById('adminLogoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('bnb-admin');
    window.location.href = 'admin-login.html';
  });

  /* ===== Pull real order data from every customer for reporting ===== */
  function collectAllOrders(){
    const all = [];
    for(let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      if(key && key.startsWith('bnb-orders-')){
        try{
          const orders = JSON.parse(localStorage.getItem(key)) || [];
          const customer = key.replace('bnb-orders-', '');
          orders.forEach(o => all.push({ ...o, customer }));
        }catch(e){}
      }
    }
    return all;
  }

  // Demo seed: if there's no real order history yet, generate a small
  // illustrative dataset so every report tab has something meaningful to
  // show. Real orders placed through checkout.html always take priority.
  function seedDemoOrdersIfEmpty(){
    if(collectAllOrders().length > 0) return;
    const names = ['Classic Espresso','House Cappuccino','Slow Cold Brew','Butter Croissant','Caramel Macchiato','Iced Mocha','Cheese Toastie','Chocolate Muffin'];
    const prices = {'Classic Espresso':450,'House Cappuccino':550,'Slow Cold Brew':600,'Butter Croissant':350,'Caramel Macchiato':620,'Iced Mocha':580,'Cheese Toastie':480,'Chocolate Muffin':320};
    const customers = ['nadeesha@email.com','kasun@email.com','ishara@email.com','dilan@email.com','sanduni@email.com'];
    const statuses = ['completed','completed','completed','ready','prep','cancelled'];
    for(let c = 0; c < customers.length; c++){
      const key = 'bnb-orders-' + customers[c];
      const orders = [];
      const orderCount = 3 + (c % 3);
      for(let i = 0; i < orderCount; i++){
        const itemCount = 1 + Math.floor(Math.random()*2);
        const items = [];
        for(let j = 0; j < itemCount; j++){
          const name = names[Math.floor(Math.random()*names.length)];
          items.push({ name, price: prices[name], qty: 1 + Math.floor(Math.random()*2) });
        }
        const hour = 7 + Math.floor(Math.random()*14);
        const day = new Date();
        day.setDate(day.getDate() - Math.floor(Math.random()*6));
        day.setHours(hour, Math.floor(Math.random()*60));
        const total = items.reduce((s,it) => s + it.price*it.qty, 0);
        orders.push({
          id: String(Date.now()).slice(-6) + c + i,
          date: day.toLocaleString(),
          items, type: Math.random() > 0.5 ? 'pickup' : 'delivery',
          method: Math.random() > 0.5 ? 'card' : 'cash',
          total, status: statuses[Math.floor(Math.random()*statuses.length)], refund:'none'
        });
      }
      localStorage.setItem(key, JSON.stringify(orders));
    }
  }
  seedDemoOrdersIfEmpty();

  let currentTab = 'sales';

  /* ===== Sales & Revenue ===== */
  function renderSalesTab(){
    const orders = collectAllOrders();
    const validOrders = orders.filter(o => o.status !== 'cancelled');
    const revenue = validOrders.reduce((s,o) => s + o.total, 0);
    const avgOrder = validOrders.length ? Math.round(revenue / validOrders.length) : 0;
    const cancelled = orders.filter(o => o.status === 'cancelled').length;

    // Revenue by day of week (Mon..Sun) from order dates
    const dayTotals = [0,0,0,0,0,0,0];
    const dayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    validOrders.forEach(o => {
      const d = new Date(o.date);
      if(!isNaN(d)) dayTotals[d.getDay()] += o.total;
    });
    const maxDay = Math.max(...dayTotals, 1);

    return `
      <div class="stat-row">
        <div class="stat-card"><h3>Rs ${revenue.toLocaleString()}</h3><span>Total Revenue</span></div>
        <div class="stat-card"><h3>${validOrders.length}</h3><span>Completed / Active Orders</span></div>
        <div class="stat-card"><h3>Rs ${avgOrder.toLocaleString()}</h3><span>Average Order Value</span></div>
        <div class="stat-card"><h3>${cancelled}</h3><span>Cancelled Orders</span></div>
      </div>
      <div class="panel">
        <h2>Revenue by Day of Week</h2>
        <div class="bar-chart">
          ${dayLabels.map((label, i) => `
            <div class="bar-col">
              <div class="bar-value">${dayTotals[i] ? 'Rs ' + dayTotals[i].toLocaleString() : ''}</div>
              <div class="bar" style="height:${Math.max(4, (dayTotals[i]/maxDay)*140)}px"></div>
              <div class="bar-label">${label}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  /* ===== Best-Selling Items ===== */
  function renderBestsellersTab(){
    const orders = collectAllOrders().filter(o => o.status !== 'cancelled');
    const counts = {};
    orders.forEach(o => o.items.forEach(it => { counts[it.name] = (counts[it.name] || 0) + it.qty; }));
    const ranked = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 8);
    if(!ranked.length) return `<div class="panel"><p class="empty-note">No sales data yet.</p></div>`;
    const max = ranked[0][1];
    return `
      <div class="panel">
        <h2>Top Selling Items (by quantity)</h2>
        ${ranked.map(([name, qty], i) => `
          <div class="rank-row">
            <div class="rank-num">${i+1}</div>
            <div class="rank-info">
              <strong>${name}</strong>
              <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${(qty/max)*100}%"></div></div>
            </div>
            <div class="rank-value">${qty} sold</div>
          </div>`).join('')}
      </div>`;
  }

  /* ===== Customer Trends ===== */
  function renderCustomersTab(){
    const orders = collectAllOrders();
    const byCustomer = {};
    orders.forEach(o => {
      if(!byCustomer[o.customer]) byCustomer[o.customer] = { orders:0, spend:0 };
      byCustomer[o.customer].orders += 1;
      if(o.status !== 'cancelled') byCustomer[o.customer].spend += o.total;
    });
    const list = Object.entries(byCustomer).sort((a,b) => b[1].spend - a[1].spend);
    const returning = list.filter(([,v]) => v.orders > 1).length;

    return `
      <div class="stat-row">
        <div class="stat-card"><h3>${list.length}</h3><span>Unique Customers</span></div>
        <div class="stat-card"><h3>${returning}</h3><span>Returning Customers</span></div>
        <div class="stat-card"><h3>${list.length ? Math.round((returning/list.length)*100) : 0}%</h3><span>Repeat Rate</span></div>
        <div class="stat-card"><h3>${list.length ? Math.round(orders.length/list.length*10)/10 : 0}</h3><span>Avg Orders / Customer</span></div>
      </div>
      <div class="panel">
        <h2>Customers by Total Spend</h2>
        ${list.length ? `
          <table>
            <thead><tr><th>Customer</th><th>Orders</th><th>Total Spend</th></tr></thead>
            <tbody>
              ${list.map(([email, v]) => `
                <tr><td>${email}</td><td>${v.orders}</td><td>Rs ${v.spend.toLocaleString()}</td></tr>`).join('')}
            </tbody>
          </table>` : `<p class="empty-note">No customer data yet.</p>`}
      </div>`;
  }

  /* ===== Peak Hours ===== */
  function renderPeakTab(){
    const orders = collectAllOrders();
    const hourCounts = Array(24).fill(0);
    orders.forEach(o => {
      const d = new Date(o.date);
      if(!isNaN(d)) hourCounts[d.getHours()] += 1;
    });
    // Focus on café operating hours 7am - 9pm
    const openHours = [];
    for(let h = 7; h <= 21; h++) openHours.push(h);
    const max = Math.max(...openHours.map(h => hourCounts[h]), 1);
    const peakHour = openHours.reduce((best,h) => hourCounts[h] > hourCounts[best] ? h : best, openHours[0]);
    const fmt = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'am' : 'pm');

    return `
      <div class="stat-row" style="grid-template-columns:repeat(2,1fr); max-width:520px;">
        <div class="stat-card"><h3>${fmt(peakHour)}</h3><span>Busiest Hour</span></div>
        <div class="stat-card"><h3>${orders.length}</h3><span>Total Orders Analysed</span></div>
      </div>
      <div class="panel">
        <h2>Orders by Hour of Day</h2>
        <div class="bar-chart" style="gap:6px;">
          ${openHours.map(h => `
            <div class="bar-col">
              <div class="bar gold" style="height:${Math.max(4,(hourCounts[h]/max)*140)}px"></div>
              <div class="bar-label" style="font-size:9.5px;">${fmt(h)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  /* ===== Inventory Report ===== */
  function renderInventoryTab(){
    let inv = [];
    try{ inv = JSON.parse(localStorage.getItem('bnb-inventory')) || []; }catch(e){}
    const totalValue = inv.reduce((s,i) => s + i.stock*i.cost, 0);
    const lowCount = inv.filter(i => i.stock <= i.reorder).length;
    return `
      <div class="stat-row">
        <div class="stat-card"><h3>${inv.length}</h3><span>Items Tracked</span></div>
        <div class="stat-card"><h3>Rs ${totalValue.toLocaleString()}</h3><span>Inventory Value</span></div>
        <div class="stat-card"><h3>${lowCount}</h3><span>Low Stock Items</span></div>
        <div class="stat-card"><h3><a href="inventory.html" style="color:var(--red-600); font-size:15px;">Manage →</a></h3><span>Full Inventory Panel</span></div>
      </div>
      <div class="panel">
        <h2>Stock Snapshot</h2>
        ${inv.length ? `
          <table>
            <thead><tr><th>Item</th><th>Stock</th><th>Value</th><th>Status</th></tr></thead>
            <tbody>
              ${inv.map(i => `
                <tr>
                  <td>${i.name}</td>
                  <td>${i.stock} ${i.unit}</td>
                  <td>Rs ${(i.stock*i.cost).toLocaleString()}</td>
                  <td><span class="pill ${i.stock <= i.reorder ? 'low' : 'ok'}">${i.stock <= i.reorder ? 'Low' : 'OK'}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>` : `<p class="empty-note">No inventory data yet — visit the Inventory panel to add items.</p>`}
      </div>`;
  }

  /* ===== Operational Report ===== */
  function renderOperationsTab(){
    const orders = collectAllOrders();
    const statusCounts = { new:0, prep:0, ready:0, completed:0, cancelled:0 };
    orders.forEach(o => { if(statusCounts[o.status] !== undefined) statusCounts[o.status]++; });
    const refundsRequested = orders.filter(o => o.refund === 'requested').length;
    const refundsProcessed = orders.filter(o => o.refund === 'processed').length;
    let staffCount = 0;
    try{ staffCount = (JSON.parse(localStorage.getItem('bnb-staff')) || []).length; }catch(e){}

    return `
      <div class="stat-row">
        <div class="stat-card"><h3>${orders.length}</h3><span>Total Orders</span></div>
        <div class="stat-card"><h3>${statusCounts.cancelled}</h3><span>Cancelled Orders</span></div>
        <div class="stat-card"><h3>${refundsRequested}</h3><span>Refunds Pending</span></div>
        <div class="stat-card"><h3>${staffCount}</h3><span>Active Staff</span></div>
      </div>
      <div class="panel">
        <h2>Order Status Breakdown</h2>
        <table>
          <thead><tr><th>Status</th><th>Count</th></tr></thead>
          <tbody>
            <tr><td>New</td><td>${statusCounts.new}</td></tr>
            <tr><td>Preparing</td><td>${statusCounts.prep}</td></tr>
            <tr><td>Ready</td><td>${statusCounts.ready}</td></tr>
            <tr><td>Completed</td><td>${statusCounts.completed}</td></tr>
            <tr><td>Cancelled</td><td>${statusCounts.cancelled}</td></tr>
            <tr><td>Refunds Processed</td><td>${refundsProcessed}</td></tr>
          </tbody>
        </table>
      </div>`;
  }

  /* ===== Power BI Dashboard placeholder ===== */
  function renderPowerBiTab(){
    return `
      <div class="panel">
        <div class="bi-embed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="10" width="7" height="11" rx="1"/><rect x="8.5" y="6" width="0" height="0"/></svg>
          <h3>Power BI Dashboard</h3>
          <p>This panel is where an embedded Power BI report would appear (via Power BI's "Publish to web" or embed-token URL), giving the Café Owner or Manager an interactive, visual view of the same sales, inventory and customer data shown across this Reports section.</p>
        </div>
      </div>`;
  }

  function renderTabContent(){
    const map = {
      sales: renderSalesTab, bestsellers: renderBestsellersTab, customers: renderCustomersTab,
      peak: renderPeakTab, inventory: renderInventoryTab, operations: renderOperationsTab,
      powerbi: renderPowerBiTab
    };
    document.getElementById('tabContent').innerHTML = map[currentTab]();
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      renderTabContent();
    });
  });

  renderTabContent();
</script>

</body>
</html>
