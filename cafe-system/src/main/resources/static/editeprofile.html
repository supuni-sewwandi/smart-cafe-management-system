<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile — Bean &amp; Brew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-950:#241209; --brown-900:#341A0D; --brown-800:#4A2818;
    --red-700:#8C2A1E; --red-600:#A83324;
    --cream:#F6ECDF; --cream-2:#EFE0CB; --gold:#C79A5C; --ink:#2A1A10;
    --green:#3E7A4C; --shadow:0 20px 50px -20px rgba(36,18,9,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Manrope', sans-serif; background:var(--cream); color:var(--ink); line-height:1.5; }
  a{ text-decoration:none; color:inherit; }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:700; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 28px; }

  header{ background:rgba(246,236,223,.95); border-bottom:1px solid rgba(74,40,24,.1); padding:18px 0; }
  header .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-mark{ width:40px; height:40px; border-radius:50%; background:var(--red-600); display:flex; align-items:center; justify-content:center; color:var(--cream); font-family:'Fraunces',serif; font-weight:700; font-size:16px; }
  .logo-text{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; color:var(--brown-950); }
  .back-link{ font-size:13.5px; font-weight:700; color:var(--brown-800); display:flex; align-items:center; gap:6px; }
  .back-link svg{ width:15px; height:15px; }

  main{ padding:40px 0 90px; }
  h1.title{ font-size:26px; color:var(--brown-950); margin-bottom:26px; }

  .panel{ background:#fff; border-radius:18px; padding:30px; box-shadow:0 10px 26px -20px rgba(36,18,9,.3); }

  .avatar-row{ display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .avatar{ width:64px; height:64px; border-radius:50%; background:var(--red-600); color:var(--cream); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:24px; font-weight:700; flex-shrink:0; }
  .avatar-row p{ font-size:12.5px; color:var(--brown-800); opacity:.65; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--brown-900); margin-bottom:7px; }
  .field input{ width:100%; padding:13px 15px; border-radius:12px; border:1.5px solid rgba(74,40,24,.18); font-size:14.5px; font-family:inherit; outline:none; background:#fff; }
  .field input:focus{ border-color:var(--red-600); }
  .field input:disabled{ background:var(--cream-2); color:var(--brown-800); opacity:.7; }
  .field small{ display:block; margin-top:6px; font-size:11.5px; color:var(--brown-800); opacity:.6; }

  .divider{ height:1px; background:rgba(74,40,24,.1); margin:26px 0; }

  .btn-row{ display:flex; gap:14px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; padding:14px 24px; border-radius:100px; font-weight:700; font-size:14px; cursor:pointer; border:1.5px solid transparent; flex:1; transition:transform .2s; }
  .btn-primary{ background:var(--red-600); color:var(--cream); box-shadow:0 12px 24px -10px rgba(168,51,36,.55); }
  .btn-outline{ background:transparent; border-color:var(--brown-800); color:var(--brown-900); }
  .btn:hover{ transform:translateY(-2px); }

  .success-msg{ display:none; background:rgba(62,122,76,.12); color:var(--green); font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:20px; }
  .success-msg.show{ display:block; }
  .error-msg{ display:none; background:#FBE3DE; color:var(--red-700); font-size:13px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:20px; }
  .error-msg.show{ display:block; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="menu.html" class="logo">
      <div class="logo-mark">B&amp;B</div>
      <div class="logo-text">Bean &amp; Brew</div>
    </a>
    <a href="profile.html" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Back to Profile</a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 class="title">Edit Profile</h1>

    <div class="panel">
      <div class="success-msg" id="successMsg">Your profile has been updated.</div>
      <div class="error-msg" id="errorMsg"></div>

      <div class="avatar-row">
        <div class="avatar" id="avatarInitial">?</div>
        <p>Your initials update automatically based on your name.</p>
      </div>

      <div class="field">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" disabled>
        <small>Email is used to sign in and can't be changed here.</small>
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="07X XXX XXXX">
      </div>
      <div class="field">
        <label for="address">Default Delivery Address</label>
        <input type="text" id="address" placeholder="House no, street, city">
      </div>

      <div class="divider"></div>

      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">Save Changes</button>
        <a href="profile.html" class="btn btn-outline">Cancel</a>
      </div>
    </div>
  </div>
</main>

<script>
  const user = localStorage.getItem('bnb-user');
  if(!user){
    sessionStorage.setItem('bnb-redirect', 'edit-profile.html');
    window.location.href = 'login.html';
  }

  const PROFILE_KEY = 'bnb-profile-' + user;
  function getProfile(){
    try{ return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveProfile(data){ localStorage.setItem(PROFILE_KEY, JSON.stringify(data)); }

  const profile = getProfile();
  const fallbackName = localStorage.getItem('bnb-user-name') || '';

  document.getElementById('email').value = user;
  document.getElementById('fullName').value = profile.name || fallbackName;
  document.getElementById('phone').value = profile.phone || '';
  document.getElementById('address').value = profile.address || '';

  function updateAvatar(){
    const name = document.getElementById('fullName').value.trim();
    document.getElementById('avatarInitial').textContent = name ? name.charAt(0).toUpperCase() : user.charAt(0).toUpperCase();
  }
  updateAvatar();
  document.getElementById('fullName').addEventListener('input', updateAvatar);

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const errorEl = document.getElementById('errorMsg');
    const successEl = document.getElementById('successMsg');

    if(!name){
      errorEl.textContent = 'Please enter your full name.';
      errorEl.classList.add('show');
      successEl.classList.remove('show');
      return;
    }
    errorEl.classList.remove('show');

    saveProfile({ name, phone, address });
    localStorage.setItem('bnb-user-name', name);
    successEl.classList.add('show');
  });
</script>

</body>
</html>
